name: Deploy upstream Coworkers

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: coworkers-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: fayazara/coworkers
          ref: main
          path: app
          fetch-depth: 1

      - name: Resolve upstream SHA
        id: sha
        working-directory: app
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check last deployed SHA
        id: check
        run: |
          LAST="$(gh variable get LAST_DEPLOYED_SHA 2>/dev/null || true)"
          if [ "$LAST" = "${{ steps.sha.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream is already deployed: $LAST"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commit: ${{ steps.sha.outputs.sha }}"
          fi

      - name: Setup Node
        if: success() && steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: success() && steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Write deployment config
        if: success() && steps.check.outputs.changed == 'true'
        working-directory: app
        env:
          COWORKERS_DEPLOY_JSON: ${{ secrets.COWORKERS_DEPLOY_JSON }}
        run: |
          printf '%s\n' "$COWORKERS_DEPLOY_JSON" > coworkers.deploy.json
          printf '{}\n' > empty-secrets.json

      - name: Install dependencies
        if: success() && steps.check.outputs.changed == 'true'
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Read previous version
        id: previous
        if: success() && steps.check.outputs.changed == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec cf workers deployments list --worker coworkers > /tmp/deployments.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8')); const v=d.deployments?.[0]?.versions?.[0]?.version_id; if(!v){process.exit(1)}; console.log('version='+v)" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        if: success() && steps.check.outputs.changed == 'true'
        working-directory: app
        run: pnpm typecheck

      - name: Test
        if: success() && steps.check.outputs.changed == 'true'
        working-directory: app
        run: pnpm test

      - name: Build
        if: success() && steps.check.outputs.changed == 'true'
        working-directory: app
        run: pnpm build

      - name: Deploy
        id: deploy
        if: success() && steps.check.outputs.changed == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPSTREAM_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          pnpm exec cf deploy --prebuilt --mode production \
            --secrets-file empty-secrets.json \
            --message "upstream ${UPSTREAM_SHA}" \
            --tag "upstream-${UPSTREAM_SHA:0:7}-${GITHUB_RUN_ID}"

      - name: Smoke test
        id: smoke
        if: success() && steps.check.outputs.changed == 'true'
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' https://coworkers.samfonrojas.workers.dev/)"
          echo "HTTP $code"
          test "$code" -lt 500

      - name: Roll back
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          pnpm exec cf workers deployments create \
            --worker coworkers \
            --strategy percentage \
            --bypass-deployment-checks \
            --versions "[{\"version_id\":\"${PREVIOUS_VERSION}\",\"percentage\":100}]"

      - name: Remember deployed SHA
        if: success() && steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: gh variable set LAST_DEPLOYED_SHA --body "${{ steps.sha.outputs.sha }}"
