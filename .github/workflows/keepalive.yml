name: Keep scheduled deploy active

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update keepalive marker
        run: |
          date -u +%Y-%m > .github/keepalive
          if git diff --quiet -- .github/keepalive; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m)"
          git push
